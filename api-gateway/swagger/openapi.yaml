openapi: 3.0.3
info:
  title: Winx API Gateway
  version: 1.0.0
  description: |
    API gateway entrypoint for all Winx microservices.
    All requests go through `POST /api/v1/login` first to obtain a Bearer token,
    then pass it as `Authorization: Bearer <token>` on protected endpoints.

    **WebSocket (chat):** connects directly to the chat service — not through this gateway.
    Use `ws://<host>:3006/ws?token=<access_token>`.
servers:
  - url: /
paths:

  # ─── System ───────────────────────────────────────────────────────────────────

  /healthz:
    get:
      summary: Health check
      tags: [System]
      responses:
        '200':
          description: Gateway is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: ok

  # ─── Auth ────────────────────────────────────────────────────────────────────

  /api/v1/login:
    post:
      summary: Login
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Successful login
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginSuccessResponse'
        '404':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/register:
    post:
      summary: Register
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '200':
          description: Successful registration
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/refresh:
    post:
      summary: Refresh access token
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token:
                  type: string
      responses:
        '200':
          description: New access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginSuccessResponse'
        '502':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/check:
    post:
      summary: Validate Bearer token
      tags: [Auth]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Token is valid
        '401':
          $ref: '#/components/responses/Unauthorized'
        '502':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/logout:
    post:
      summary: Logout
      tags: [Auth]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Successful logout
        '502':
          $ref: '#/components/responses/ServiceUnavailable'

  # ─── Password ─────────────────────────────────────────────────────────────────

  /api/v1/password/forgot:
    post:
      summary: Request password reset PIN
      tags: [Password]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
                  example: user@example.com
      responses:
        '200':
          description: Reset PIN sent to email
        '502':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/password/verify-pin:
    post:
      summary: Verify reset PIN
      tags: [Password]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, pin]
              properties:
                email:
                  type: string
                  format: email
                  example: user@example.com
                pin:
                  type: string
                  example: '1234'
      responses:
        '200':
          description: PIN is valid
        '400':
          description: Invalid PIN
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/password/reset:
    post:
      summary: Reset password with PIN
      tags: [Password]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, pin, password]
              properties:
                email:
                  type: string
                  format: email
                  example: user@example.com
                pin:
                  type: string
                  example: '1234'
                password:
                  type: string
                  example: NewPassword123!
      responses:
        '200':
          description: Password reset successful
        '502':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/password/change:
    post:
      summary: Change password (authenticated)
      tags: [Password]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [old_password, new_password]
              properties:
                old_password:
                  type: string
                  example: OldPassword123!
                new_password:
                  type: string
                  example: NewPassword123!
      responses:
        '200':
          description: Password changed
        '401':
          $ref: '#/components/responses/Unauthorized'
        '502':
          $ref: '#/components/responses/ServiceUnavailable'

  # ─── Profile ──────────────────────────────────────────────────────────────────

  /api/v1/profile/me:
    get:
      summary: Get my profile
      tags: [Profile]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Profile data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '502':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/profile/store:
    post:
      summary: Create or update my profile
      tags: [Profile]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileStoreRequest'
      responses:
        '200':
          description: Profile updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '201':
          description: Profile created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/profile/photo:
    get:
      summary: Get my photos
      tags: [Profile]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Photo data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '502':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/profile/photo/store:
    post:
      summary: Upload profile photo
      tags: [Profile]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [photo]
              properties:
                photo:
                  type: string
                  format: binary
                  description: Image file (JPEG, PNG, etc.)
      responses:
        '200':
          description: Photo updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '201':
          description: Photo uploaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Missing or invalid photo file
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '502':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/profile/interests:
    get:
      summary: List all available interests
      tags: [Profile]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Interests list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '502':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/profile/location/ip:
    get:
      summary: Lookup location by request IP
      tags: [Profile]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Location data (city, country, coordinates)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '502':
          $ref: '#/components/responses/ServiceUnavailable'

  # ─── Recommendations ──────────────────────────────────────────────────────────

  /api/v1/recommendations:
    get:
      summary: Get personalized profile recommendations
      tags: [Recommendations]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/offset'
      responses:
        '200':
          description: List of recommended profiles to swipe on
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '502':
          $ref: '#/components/responses/ServiceUnavailable'

  # ─── Swipes ───────────────────────────────────────────────────────────────────

  /api/v1/swipes/left:
    post:
      summary: Swipe left (pass)
      tags: [Swipes]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SwipeRequest'
      responses:
        '200':
          description: Swipe recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '502':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/swipes/right:
    post:
      summary: Swipe right (like)
      description: If the other user already liked you, a match is created automatically.
      tags: [Swipes]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SwipeRequest'
      responses:
        '200':
          description: Swipe recorded (no mutual match yet)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '201':
          description: Match created (mutual like)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '502':
          $ref: '#/components/responses/ServiceUnavailable'

  # ─── Matches ──────────────────────────────────────────────────────────────────

  /api/v1/matches:
    get:
      summary: List my matches
      tags: [Matches]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/offset'
      responses:
        '200':
          description: Matches list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '502':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/matches/{id}:
    delete:
      summary: Unmatch (delete a match)
      tags: [Matches]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
          example: 42
      responses:
        '200':
          description: Match deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Match not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          $ref: '#/components/responses/ServiceUnavailable'

  # ─── Notifications ────────────────────────────────────────────────────────────

  /api/v1/notifications:
    get:
      summary: List my notifications
      tags: [Notifications]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Notifications list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '502':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/notifications/{id}:
    delete:
      summary: Delete a notification
      tags: [Notifications]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
          example: 1
      responses:
        '200':
          description: Notification deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Notification not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          $ref: '#/components/responses/ServiceUnavailable'

  # ─── Chats ────────────────────────────────────────────────────────────────────

  /api/v1/chats:
    get:
      summary: List my chats
      description: Returns all chats the authenticated user is a member of. Chats are created automatically when a match occurs.
      tags: [Chat]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/offset'
      responses:
        '200':
          description: Chat list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '502':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/chats/{id}/messages:
    get:
      summary: Get message history for a chat
      tags: [Chat]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
          example: 1
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/offset'
      responses:
        '200':
          description: Message list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: You are not a member of this chat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Chat not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          $ref: '#/components/responses/ServiceUnavailable'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer

  parameters:
    limit:
      in: query
      name: limit
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
      description: Number of items to return
    offset:
      in: query
      name: offset
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
      description: Number of items to skip

  responses:
    Unauthorized:
      description: Missing or invalid Bearer token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServiceUnavailable:
      description: Gateway could not reach the upstream service
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:

    # ── Auth ──────────────────────────────────────────────────────────────────

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: user@example.com
        password:
          type: string
          example: Password123!

    LoginSuccessResponse:
      type: object
      properties:
        access_token:
          type: string
        token_type:
          type: string
          example: Bearer
        refresh_token:
          type: string
        expires_in:
          type: integer
          format: int64
        scope:
          type: string

    RegisterRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: newuser@example.com
        password:
          type: string
          example: Password123!

    # ── Profile ───────────────────────────────────────────────────────────────

    ProfileStoreRequest:
      type: object
      required: [location]
      properties:
        first_name:
          type: string
          maxLength: 255
          example: Arman
        birth_date:
          type: string
          format: date
          example: '2000-03-15'
          description: Format YYYY-MM-DD
        gender:
          type: string
          enum: [man, woman, non_binary, other]
          example: man
        show_gender:
          type: boolean
          example: true
          description: Whether to show gender on public profile
        show_age:
          type: boolean
          example: true
          description: Whether to show age on public profile
        about_me:
          type: string
          maxLength: 2000
          example: Love mountains and good coffee.
        job_title:
          type: string
          maxLength: 255
          example: Software Engineer
        company:
          type: string
          maxLength: 255
          example: Winx
        school:
          type: string
          maxLength: 255
          example: KBTU
        interest_ids:
          type: array
          maxItems: 20
          items:
            type: integer
            format: int64
          example: [1, 3, 7]
          description: IDs from GET /api/v1/profile/interests
        interested_in:
          type: array
          maxItems: 4
          items:
            type: string
            enum: [man, woman, non_binary, everyone]
          example: [woman]
        looking_for:
          type: string
          enum:
            - long_term_partner
            - long_term_open_to_short
            - short_term_open_to_long_term
            - short_term
            - new_friends
            - still_figuring_it_out
          example: long_term_partner
        lifestyle:
          type: object
          additionalProperties: true
          example:
            smoking: never
            drinking: socially
            exercise: often
          description: Free-form lifestyle key-value pairs
        preferences:
          type: object
          additionalProperties: true
          example:
            min_age: 22
            max_age: 30
            max_distance_km: 50
          description: Free-form matching preference key-value pairs
        location:
          $ref: '#/components/schemas/LocationRequest'

    LocationRequest:
      type: object
      required: [city]
      properties:
        city:
          type: string
          maxLength: 255
          example: Almaty
        country:
          type: string
          maxLength: 255
          example: Kazakhstan
        current_location:
          $ref: '#/components/schemas/CoordinatesRequest'

    CoordinatesRequest:
      type: object
      required: [latitude, longitude]
      properties:
        latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
          example: 43.222
        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180
          example: 76.851

    # ── Swipes ────────────────────────────────────────────────────────────────

    SwipeRequest:
      type: object
      required: [swiped_id]
      properties:
        swiped_id:
          type: integer
          format: int64
          minimum: 1
          example: 42
          description: ID of the user being swiped on

    # ── Common ────────────────────────────────────────────────────────────────

    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: ok
        data:
          nullable: true

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: error message
        data:
          nullable: true
