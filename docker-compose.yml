services:
  api-gateway-winx:
    build:
      context: ./api-gateway
      dockerfile: ../docker/api-gateway/Dockerfile
    container_name: api-gateway-winx
    ports:
      - '3000:3000'
    depends_on:
      auth-winx:
        condition: service_started
      notification-winx:
        condition: service_started
      profile-winx:
        condition: service_started
      match-winx:
        condition: service_started
    environment:
      - APP_ENV=development
    networks:
      - winx-network
    restart: unless-stopped

  auth-winx:
    build:
      context: ./auth
      dockerfile: ../docker/auth/Dockerfile
    container_name: auth-winx
    ports:
      - '3001:3001'
    environment:
      - APP_ENV=development
    depends_on:
      postgres-winx:
        condition: service_healthy
      redis-winx:
        condition: service_healthy
      kafka-winx:
        condition: service_started
    networks:
      - winx-network
    restart: unless-stopped

  notification-winx:
    build:
      context: ./notification
      dockerfile: ../docker/notification/Dockerfile
    container_name: notification-winx
    ports:
      - '3002:3002'
    environment:
      - APP_ENV=development
    depends_on:
      postgres-winx:
        condition: service_healthy
      redis-winx:
        condition: service_healthy
      kafka-winx:
        condition: service_started
    networks:
      - winx-network
    restart: unless-stopped

  profile-winx:
    build:
      context: ./profile
      dockerfile: ../docker/profile/Dockerfile
    container_name: profile-winx
    ports:
      - '3003:3003'
    environment:
      - APP_ENV=development
    depends_on:
      postgres-winx:
        condition: service_healthy
      mongo-winx:
        condition: service_started
      redis-winx:
        condition: service_healthy
      kafka-winx:
        condition: service_started
    networks:
      - winx-network
    restart: unless-stopped

  match-winx:
    build:
      context: ./match
      dockerfile: ../docker/match/Dockerfile
    container_name: match-winx
    ports:
      - '3004:3004'
    environment:
      - APP_ENV=development
    depends_on:
      postgres-winx:
        condition: service_healthy
      kafka-winx:
        condition: service_started
    networks:
      - winx-network
    restart: unless-stopped

  test-dashboard-winx:
    build:
      context: .
      dockerfile: docker/test-dashboard/Dockerfile
    container_name: test-dashboard-winx
    ports:
      - '8080:80'
    depends_on:
      - api-gateway-winx
    networks:
      - winx-network
    restart: unless-stopped

  mongo-winx:
    image: mongo:7
    container_name: mongo-winx
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db
    networks:
      - winx-network
    restart: unless-stopped

  postgres-winx:
    image: postgis/postgis:16-3.5-alpine
    container_name: postgres-winx
    environment:
      POSTGRES_DB: winx-db
      POSTGRES_USER: winx
      POSTGRES_PASSWORD: winx
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - winx-network
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U winx -d winx-db']
      interval: 10s
      timeout: 5s
      retries: 5

  kafka-winx:
    image: bitnamilegacy/kafka:4.0.0-debian-12-r10
    container_name: kafka-winx
    environment:
      KAFKA_CFG_NODE_ID: 1
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka-winx:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:9094
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka-winx:9092,PLAINTEXT_HOST://localhost:9094
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      ALLOW_PLAINTEXT_LISTENER: 'yes'
    ports:
      - '9094:9094'
    networks:
      - winx-network
    restart: unless-stopped

  redis-winx:
    image: redis:7-alpine
    container_name: redis-winx
    ports:
      - '6380:6379'
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis_data:/data
    networks:
      - winx-network
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  winx-network:
    driver: bridge

volumes:
  mongo_data:
  postgres_data:
  kafka_data:
  redis_data:
