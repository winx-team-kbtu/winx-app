services:
  caddy-winx:
    image: caddy:2-alpine
    container_name: caddy-winx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      PROMETHEUS_BASIC_AUTH_HASH: ${PROMETHEUS_BASIC_AUTH_HASH}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api-gateway-winx

  frontend-winx:
    image: ghcr.io/winx-team-kbtu/frontend:latest
    container_name: frontend-winx
    restart: unless-stopped
    depends_on:
      - api-gateway-winx

  api-gateway-winx:
    image: ghcr.io/winx-team-kbtu/api-gateway:latest
    container_name: api-gateway-winx
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - auth-winx
      - notification-winx
      - profile-winx
      - match-winx
      - recommendation-winx
      - chat-winx

  auth-winx:
    image: ghcr.io/winx-team-kbtu/auth:latest
    container_name: auth-winx
    restart: unless-stopped
    environment:
      DB_HOST: postgres-winx
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-winx-db}
      DB_USER: ${DB_USER:-winx}
      DB_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3001:3001"
    depends_on:
      - postgres-winx
      - redis-winx
      - kafka-winx
      - graylog-winx

  notification-winx:
    image: ghcr.io/winx-team-kbtu/notification:latest
    container_name: notification-winx
    restart: unless-stopped
    environment:
      DB_HOST: postgres-winx
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-winx-db}
      DB_USER: ${DB_USER:-winx}
      DB_PASSWORD: ${DB_PASSWORD}
      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: 587
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM_EMAIL: ${SMTP_USERNAME}
      SMTP_FROM_NAME: Winx
      RESEND_API_KEY: ${RESEND_API_KEY}
    ports:
      - "3002:3002"
    depends_on:
      - postgres-winx
      - redis-winx
      - kafka-winx
      - graylog-winx

  profile-winx:
    image: ghcr.io/winx-team-kbtu/profile:latest
    container_name: profile-winx
    restart: unless-stopped
    environment:
      DB_HOST: postgres-winx
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-winx-db}
      DB_USER: ${DB_USER:-winx}
      DB_PASSWORD: ${DB_PASSWORD}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: eu-north-1
    ports:
      - "3003:3003"
    depends_on:
      - postgres-winx
      - mongo-winx
      - redis-winx
      - kafka-winx
      - graylog-winx

  match-winx:
    image: ghcr.io/winx-team-kbtu/match:latest
    container_name: match-winx
    restart: unless-stopped
    environment:
      DB_HOST: postgres-winx
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-winx-db}
      DB_USER: ${DB_USER:-winx}
      DB_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3004:3004"
    depends_on:
      - postgres-winx
      - kafka-winx
      - graylog-winx

  recommendation-winx:
    image: ghcr.io/winx-team-kbtu/recommendation:latest
    container_name: recommendation-winx
    restart: unless-stopped
    environment:
      DB_HOST: postgres-winx
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-winx-db}
      DB_USER: ${DB_USER:-winx}
      DB_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3005:3005"
    depends_on:
      - postgres-winx
      - redis-winx
      - kafka-winx
      - graylog-winx

  chat-winx:
    image: ghcr.io/winx-team-kbtu/chat:latest
    container_name: chat-winx
    restart: unless-stopped
    environment:
      DB_HOST: postgres-winx
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-winx-db}
      DB_USER: ${DB_USER:-winx}
      DB_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3006:3006"
    depends_on:
      - postgres-winx
      - redis-winx
      - kafka-winx
      - graylog-winx

  opensearch-winx:
    image: opensearchproject/opensearch:2.12.0
    container_name: opensearch-winx
    restart: unless-stopped
    environment:
      OPENSEARCH_JAVA_OPTS: "-Xms256m -Xmx256m"
      bootstrap.memory_lock: "false"
      discovery.type: single-node
      plugins.security.disabled: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
    volumes:
      - opensearch_data:/usr/share/opensearch/data

  graylog-winx:
    image: graylog/graylog:6.0
    container_name: graylog-winx
    restart: unless-stopped
    environment:
      GRAYLOG_NODE_ID_FILE: /usr/share/graylog/data/config/node-id
      GRAYLOG_PASSWORD_SECRET: ${GRAYLOG_PASSWORD_SECRET}
      GRAYLOG_ROOT_PASSWORD_SHA2: ${GRAYLOG_ROOT_PASSWORD_SHA2}
      GRAYLOG_HTTP_BIND_ADDRESS: 0.0.0.0:9000
      GRAYLOG_HTTP_EXTERNAL_URI: ${GRAYLOG_EXTERNAL_URI:-http://localhost:9000/}
      GRAYLOG_ELASTICSEARCH_HOSTS: http://opensearch-winx:9200
      GRAYLOG_MONGODB_URI: mongodb://mongo-winx:27017/graylog
    entrypoint: /usr/bin/tini -- wait-for-it opensearch-winx:9200 -- /docker-entrypoint.sh
    ports:
      - "9000:9000"
      - "12201:12201/tcp"
    volumes:
      - graylog_data:/usr/share/graylog/data
    depends_on:
      - mongo-winx
      - opensearch-winx

  mongo-winx:
    image: mongo:7
    container_name: mongo-winx
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  postgres-winx:
    image: postgis/postgis:16-3.5-alpine
    container_name: postgres-winx
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-winx-db}
      POSTGRES_USER: ${DB_USER:-winx}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  kafka-winx:
    image: bitnamilegacy/kafka:4.0.0-debian-12-r10
    container_name: kafka-winx
    restart: unless-stopped
    environment:
      KAFKA_CFG_NODE_ID: 1
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka-winx:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:9094
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka-winx:9092,PLAINTEXT_HOST://localhost:9094
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_CFG_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_CFG_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_CFG_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      ALLOW_PLAINTEXT_LISTENER: "yes"
    ports:
      - "9094:9094"
    volumes:
      - kafka_data:/bitnami/kafka

  redis-winx:
    image: redis:7-alpine
    container_name: redis-winx
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data

volumes:
  graylog_data:
    name: winx-graylog-data
  opensearch_data:
    name: winx-opensearch-data
  mongo_data:
    name: winx-mongo-data
  postgres_data:
    name: winx-postgres-data
  kafka_data:
    name: winx-kafka-data
  redis_data:
    name: winx-redis-data
  caddy_data:
    name: winx-caddy-data
  caddy_config:
    name: winx-caddy-config
