services:
  api-gateway-winx:
    image: ghcr.io/winx-team-kbtu/api-gateway:latest
    container_name: api-gateway-winx
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - auth-winx
      - notification-winx

  auth-winx:
    image: ghcr.io/winx-team-kbtu/auth:latest
    container_name: auth-winx
    restart: unless-stopped
    environment:
      DB_HOST: postgres-winx
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-winx-db}
      DB_USER: ${DB_USER:-winx}
      DB_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3001:3001"
    depends_on:
      - postgres-winx
      - redis-winx
      - kafka-winx

  notification-winx:
    image: ghcr.io/winx-team-kbtu/notification:latest
    container_name: notification-winx
    restart: unless-stopped
    environment:
      DB_HOST: postgres-winx
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-winx-db}
      DB_USER: ${DB_USER:-winx}
      DB_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3002:3002"
    depends_on:
      - postgres-winx
      - redis-winx
      - kafka-winx

  profile-winx:
    image: ghcr.io/winx-team-kbtu/profile:latest
    container_name: profile-winx
    restart: unless-stopped
    environment:
      DB_HOST: postgres-winx
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-winx-db}
      DB_USER: ${DB_USER:-winx}
      DB_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3003:3003"
    depends_on:
      - postgres-winx
      - mongo-winx
      - redis-winx
      - kafka-winx

  match-winx:
    image: ghcr.io/winx-team-kbtu/match:latest
    container_name: match-winx
    restart: unless-stopped
    environment:
      DB_HOST: postgres-winx
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-winx-db}
      DB_USER: ${DB_USER:-winx}
      DB_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3004:3004"
    depends_on:
      - postgres-winx
      - kafka-winx

  recommendation-winx:
    image: ghcr.io/winx-team-kbtu/recommendation:latest
    container_name: recommendation-winx
    restart: unless-stopped
    environment:
      DB_HOST: postgres-winx
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-winx-db}
      DB_USER: ${DB_USER:-winx}
      DB_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3005:3005"
    depends_on:
      - postgres-winx
      - redis-winx
      - kafka-winx

  mongo-winx:
    image: mongo:7
    container_name: mongo-winx
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  postgres-winx:
    image: postgis/postgis:16-3.5-alpine
    container_name: postgres-winx
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-winx-db}
      POSTGRES_USER: ${DB_USER:-winx}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  kafka-winx:
    image: bitnamilegacy/kafka:4.0.0-debian-12-r10
    container_name: kafka-winx
    restart: unless-stopped
    environment:
      KAFKA_CFG_NODE_ID: 1
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka-winx:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:9094
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka-winx:9092,PLAINTEXT_HOST://localhost:9094
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_CFG_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_CFG_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_CFG_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      ALLOW_PLAINTEXT_LISTENER: "yes"
    ports:
      - "9094:9094"
    volumes:
      - kafka_data:/bitnami/kafka

  redis-winx:
    image: redis:7-alpine
    container_name: redis-winx
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data

volumes:
  mongo_data:
    name: winx-mongo-data
  postgres_data:
    name: winx-postgres-data
  kafka_data:
    name: winx-kafka-data
  redis_data:
    name: winx-redis-data
