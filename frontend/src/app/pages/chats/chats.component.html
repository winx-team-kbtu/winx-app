<main class="page">
  <header class="screen-heading">
    <h1>Общение</h1>
    <a class="icon-button" routerLink="/notifications" aria-label="Уведомления"
      ><app-icon name="bell" [size]="21"
    /></a>
  </header>
  <nav class="local-tabs" aria-label="Общение">
    <a routerLink="/chats" class="selected" aria-current="page">Чаты</a
    ><a routerLink="/matches">Совпадения</a>
  </nav>
  <div *ngIf="error" class="error-msg" role="alert">
    {{ error }}<button class="btn btn-ghost" (click)="load()">Повторить</button>
  </div>
  <div *ngIf="loading" class="spinner" aria-label="Загрузка чатов"></div>
  <section *ngIf="!loading && !error && chats.length === 0" class="empty-state">
    <div class="empty-icon"><app-icon name="chat" [size]="24" /></div>
    <h3>Пока нет переписок</h3>
    <p>Начните общение после взаимной симпатии.</p>
    <a class="btn btn-primary mt-24" routerLink="/discover">Смотреть людей</a>
  </section>
  <div *ngIf="!loading && chats.length" class="communication-list">
    <a
      class="communication-row chat-row"
      *ngFor="let chat of chats"
      [routerLink]="['/chats', chat.id]"
      [state]="{ peerName: getChatName(chat) }"
      ><span class="avatar" aria-hidden="true">{{ getInitial(chat) }}</span
      ><span class="row-details"
        ><strong>{{ getChatName(chat) }}</strong></span
      ><app-icon name="chevron" class="muted" [size]="18"
    /></a>
  </div>
</main>
