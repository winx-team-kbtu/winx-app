<div class="auth-page">
  <div class="auth-decoration">
    <span class="star s1">✦</span>
    <span class="star s2">✧</span>
    <span class="star s3">✦</span>
    <span class="star s4">✧</span>
  </div>

  <div class="auth-card">
    <div class="auth-logo">
      <span class="logo-icon">🧚</span>
      <h1 class="logo-text">Winx</h1>
      <p class="logo-sub">Find your magical match</p>
    </div>

    <div *ngIf="error" class="error-msg">{{ error }}</div>

    <form (ngSubmit)="submit()" #form="ngForm">
      <div class="form-group">
        <label for="email">Email</label>
        <input
          id="email"
          type="email"
          class="form-control"
          placeholder="your@email.com"
          [(ngModel)]="email"
          name="email"
          required
        />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input
          id="password"
          type="password"
          class="form-control"
          placeholder="••••••••"
          [(ngModel)]="password"
          name="password"
          required
        />
      </div>

      <button type="submit" class="btn btn-primary w-full" [disabled]="loading || !form.valid">
        {{ loading ? 'Signing in...' : 'Sign In ✨' }}
      </button>
    </form>

    <p class="auth-footer">
      Don't have an account?
      <a routerLink="/register">Register</a>
    </p>
  </div>
</div>
