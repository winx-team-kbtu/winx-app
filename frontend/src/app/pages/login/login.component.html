<main class="auth-page">
  <a class="auth-brand" routerLink="/login" aria-label="Winx">winx<span>.</span></a>
  <section class="auth-card">
    <h1>Вход</h1>
    <p class="auth-notice" role="status" *ngIf="notice">{{ notice }}</p>
    <div *ngIf="error" class="error-msg" role="alert">{{ error }}</div>
    <form (ngSubmit)="submit()" #form="ngForm">
      <div class="form-group">
        <label for="email">Эл. почта или логин</label
        ><input
          id="email"
          type="text"
          class="form-control"
          placeholder="you@example.com"
          [(ngModel)]="email"
          name="email"
          autocomplete="username"
          autocapitalize="none"
          spellcheck="false"
          required
        />
      </div>
      <div class="form-group">
        <label for="password">Пароль</label
        ><input
          id="password"
          type="password"
          class="form-control"
          [(ngModel)]="password"
          name="password"
          autocomplete="current-password"
          required
        />
      </div>
      <button type="submit" class="btn btn-primary w-full" [disabled]="loading || !form.valid">
        {{ loading ? 'Входим…' : 'Войти' }}
      </button>
    </form>
    <p class="auth-footer">
      Нет аккаунта?<a routerLink="/register" [queryParams]="{ returnUrl: returnUrl }"
        >Зарегистрироваться</a
      >
    </p>
  </section>
</main>
