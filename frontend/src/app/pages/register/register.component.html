<div class="auth-page">
  <div class="auth-decoration">
    <span class="star s1">✦</span>
    <span class="star s2">✧</span>
    <span class="star s3">✦</span>
    <span class="star s4">✧</span>
  </div>

  <div class="auth-card">
    <div class="auth-logo">
      <span class="logo-icon">🌸</span>
      <h1 class="logo-text">Join Winx</h1>
      <p class="logo-sub">Start your magical journey</p>
    </div>

    <div *ngIf="success" class="success-msg">
      🎉 Account created! Redirecting to login...
    </div>
    <div *ngIf="error" class="error-msg">{{ error }}</div>

    <form *ngIf="!success" (ngSubmit)="submit()" #form="ngForm">
      <div class="form-group">
        <label for="email">Email</label>
        <input
          id="email"
          type="email"
          class="form-control"
          placeholder="your@email.com"
          [(ngModel)]="email"
          name="email"
          required
        />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input
          id="password"
          type="password"
          class="form-control"
          placeholder="••••••••"
          [(ngModel)]="password"
          name="password"
          required
          minlength="8"
        />
      </div>

      <button type="submit" class="btn btn-primary w-full" [disabled]="loading || !form.valid">
        {{ loading ? 'Creating account...' : 'Create Account ✨' }}
      </button>
    </form>

    <p class="auth-footer">
      Already have an account?
      <a routerLink="/login">Sign in</a>
    </p>
  </div>
</div>
