<main class="auth-page">
  <a class="auth-brand" routerLink="/login" aria-label="Winx">winx<span>.</span></a>
  <section class="auth-card">
    <h1>Регистрация</h1>
    <div *ngIf="success" class="success-msg" role="status">
      {{ loading ? 'Аккаунт создан. Входим…' : 'Аккаунт создан.' }}
    </div>
    <div *ngIf="error" class="error-msg" role="alert">{{ error }}</div>
    <form *ngIf="!success" (ngSubmit)="submit()" #form="ngForm">
      <div class="form-group">
        <label for="email">Эл. почта</label
        ><input
          id="email"
          type="email"
          class="form-control"
          placeholder="you@example.com"
          [(ngModel)]="email"
          name="email"
          autocomplete="email"
          required
        />
      </div>
      <div class="form-group">
        <label for="password">Пароль</label
        ><input
          id="password"
          type="password"
          class="form-control"
          placeholder="От 8 символов"
          [(ngModel)]="password"
          name="password"
          autocomplete="new-password"
          required
          minlength="8"
        />
      </div>
      <section class="privacy-notice" aria-labelledby="privacy-notice-title" tabindex="0">
        <h2 id="privacy-notice-title">Уведомление о персональных данных</h2>
        <div *ngFor="let section of notice">
          <h3>{{ section.title }}</h3>
          <ul>
            <li *ngFor="let item of section.items">{{ item }}</li>
          </ul>
        </div>
      </section>
      <label class="consent-field"
        ><input
          type="checkbox"
          [(ngModel)]="consentAccepted"
          name="consentAccepted"
          required
        /><span>Я прочитал(а) уведомление и согласен(на) на обработку этих данных.</span></label
      >
      <button
        type="submit"
        class="btn btn-primary w-full"
        [disabled]="loading || !form.valid || !consentAccepted"
      >
        {{ loading ? 'Создаём аккаунт…' : 'Создать аккаунт' }}
      </button>
    </form>
    <p class="auth-footer">
      Уже есть аккаунт?<a routerLink="/login" [queryParams]="{ returnUrl: returnUrl }">Войти</a>
    </p>
  </section>
</main>
