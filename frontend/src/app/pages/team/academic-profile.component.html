<main class="team-page profile-overview">
  <header class="screen-heading">
    <h1>Профиль</h1>
    <span class="inline-status" role="status" *ngIf="success">{{ success }}</span>
  </header>
  <div *ngIf="loading" class="spinner" aria-label="Загрузка профиля"></div>
  <div *ngIf="error && !editing" class="error-msg" role="alert">
    {{ error }}<button class="btn btn-ghost" (click)="load()">Повторить</button>
  </div>
  <ng-container *ngIf="!loading && ready">
    <div class="profile-identity">
      <span class="profile-initial" aria-hidden="true">{{ name.charAt(0) }}</span>
      <div>
        <h2>{{ name }}</h2>
        <p>{{ role || 'Роль не указана' }}</p>
      </div>
    </div>
    <p *ngIf="!selectedIds.length" class="setup-note">
      Выберите предметы, чтобы найти однокурсников.
    </p>
    <div class="settings-list">
      <button class="setting-row" (click)="edit('basics')">
        <app-icon name="user" /><span
          ><strong>Основное</strong><small>{{ name }} · {{ city }}</small></span
        ><app-icon name="chevron" [size]="17" />
      </button>
      <button class="setting-row" (click)="edit('courses')">
        <app-icon name="book" /><span
          ><strong>Предметы</strong><small>{{ selectedNames }}</small></span
        ><app-icon name="chevron" [size]="17" />
      </button>
      <button class="setting-row" (click)="edit('skills')">
        <app-icon name="plus" /><span
          ><strong>Навыки</strong
          ><small
            >{{ skills.slice(0, 3).join(', ') || 'Добавить'
            }}{{ skills.length > 3 ? ' +' + (skills.length - 3) : '' }}</small
          ></span
        ><app-icon name="chevron" [size]="17" />
      </button>
      <button class="setting-row" (click)="edit('role')">
        <app-icon name="users" /><span
          ><strong>Роль в команде</strong><small>{{ role || 'Выбрать' }}</small></span
        ><app-icon name="chevron" [size]="17" />
      </button>
    </div>
  </ng-container>
  <button class="logout-link" (click)="auth.logout()">Выйти из аккаунта</button>
  <app-delete-account />
  <app-sheet
    *ngIf="editing as section"
    [title]="titles[section]"
    [locked]="saving"
    (closed)="cancel()"
  >
    <form class="sheet-form" (ngSubmit)="save()" #form="ngForm">
      <div class="sheet-body">
        <ng-container *ngIf="section === 'basics'"
          ><div class="form-group">
            <label for="team-name-profile">Имя</label
            ><input
              id="team-name-profile"
              class="form-control"
              [(ngModel)]="name"
              name="name"
              required
              maxlength="100"
              autocomplete="given-name"
            />
          </div>
          <div class="form-group">
            <label for="team-city-profile">Город</label
            ><input
              id="team-city-profile"
              class="form-control"
              [(ngModel)]="city"
              name="city"
              required
              maxlength="100"
              autocomplete="address-level2"
            /></div
        ></ng-container>
        <div *ngIf="section === 'courses'" class="course-options">
          <label
            *ngFor="let course of courses"
            class="course-option"
            [class.selected]="selectedIds.includes(course.id)"
            ><input
              type="checkbox"
              [checked]="selectedIds.includes(course.id)"
              (change)="toggleCourse(course.id)"
              [attr.aria-label]="label(course.code, course.title)"
            /><span>{{ label(course.code, course.title) }}</span></label
          >
        </div>
        <div *ngIf="section === 'skills'" class="form-group">
          <label for="skills">Ваши навыки</label
          ><textarea
            id="skills"
            class="form-control"
            [(ngModel)]="skillsText"
            name="skills"
            placeholder="Go, SQL, Figma"
          ></textarea>
          <p class="field-note">Перечислите через запятую.</p>
          <p class="error-msg" *ngIf="skillsError" role="alert">
            {{ skillsError }}
          </p>
        </div>
        <div *ngIf="section === 'role'" class="form-group">
          <label for="preferred-role">Чем хотите заниматься?</label
          ><input
            id="preferred-role"
            class="form-control"
            [(ngModel)]="role"
            name="role"
            maxlength="50"
            placeholder="Например, бэкенд-разработкой"
          />
        </div>
        <p *ngIf="error" class="error-msg" role="alert">{{ error }}</p>
      </div>
      <div class="sheet-actions">
        <button class="btn btn-outline" type="button" [disabled]="saving" (click)="cancel()">
          Отмена</button
        ><button
          type="submit"
          class="btn btn-primary"
          [disabled]="saving || (section === 'skills' && !!skillsError) || !form.valid"
        >
          {{ saving ? 'Сохранение…' : 'Сохранить' }}
        </button>
      </div>
    </form>
  </app-sheet>
</main>
