apiVersion: 1

# Configure your notification method below.
# Grafana supports: email, Telegram, Slack, PagerDuty, webhook, etc.
# Uncomment and fill in the one you want to use.

contactPoints:
  - orgId: 1
    name: winx-team
    receivers:

      # --- Telegram ---
      - uid: winx-telegram
        type: telegram
        settings:
          bottoken: "${TG_BOT_TOKEN}"
          chatid: "${TG_CHAT_ID}"

      # --- Email ---
      # Requires GF_SMTP_* env vars set in docker-compose.monitoring.yml
      # - uid: winx-email
      #   type: email
      #   settings:
      #     addresses: your@email.com

      # --- Slack ---
      # - uid: winx-slack
      #   type: slack
      #   settings:
      #     url: YOUR_SLACK_WEBHOOK_URL
      #     channel: '#alerts'

policies:
  - orgId: 1
    receiver: winx-team
    group_by: ['alertname', 'service']
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
