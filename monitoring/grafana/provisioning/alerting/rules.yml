apiVersion: 1

groups:
  - orgId: 1
    name: Winx
    folder: Winx
    interval: 1m
    rules:

      - uid: winx-high-error-rate
        title: High Error Rate (>10%)
        condition: C
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High error rate on {{ $labels.service }}"
          description: "Error rate has been above 10% for 5 minutes."
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus-winx
            model:
              expr: "sum(rate(http_requests_total{status=~\"[45]..\"}[5m])) by (service) / sum(rate(http_requests_total[5m])) by (service) * 100"
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              refId: C
              expression: A
              conditions:
                - evaluator: { type: gt, params: [10] }
                  operator: { type: and }
                  query: { params: [A] }
                  reducer: { type: last }

      - uid: winx-high-p99-latency
        title: High p99 Latency (>2s)
        condition: C
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High latency on {{ $labels.service }}"
          description: "p99 latency has been above 2 seconds for 5 minutes."
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus-winx
            model:
              expr: "histogram_quantile(0.99, sum(rate(http_request_duration_seconds_bucket[5m])) by (service, le))"
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              refId: C
              expression: A
              conditions:
                - evaluator: { type: gt, params: [2] }
                  operator: { type: and }
                  query: { params: [A] }
                  reducer: { type: last }

      - uid: winx-service-down
        title: Service Down
        condition: C
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Service {{ $labels.job }} is down"
          description: "Prometheus has not received metrics from this service for 2 minutes."
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus-winx
            model:
              expr: "up{job=~\"api-gateway|auth|notification|profile|match|recommendation|chat\"}"
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              refId: C
              expression: A
              conditions:
                - evaluator: { type: lt, params: [1] }
                  operator: { type: and }
                  query: { params: [A] }
                  reducer: { type: last }

      - uid: winx-postgres-high-connections
        title: PostgreSQL High Connection Usage (>80%)
        condition: C
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "PostgreSQL connection pool running high"
          description: "More than 80% of max connections are in use."
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus-winx
            model:
              expr: "sum(pg_stat_activity_count) / pg_settings_max_connections * 100"
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              refId: C
              expression: A
              conditions:
                - evaluator: { type: gt, params: [80] }
                  operator: { type: and }
                  query: { params: [A] }
                  reducer: { type: last }

      - uid: winx-kafka-high-lag
        title: Kafka Consumer Lag High (>1000)
        condition: C
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Kafka consumer group {{ $labels.consumergroup }} is lagging"
          description: "Consumer lag has been above 1000 messages for 5 minutes."
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus-winx
            model:
              expr: "sum(kafka_consumergroup_lag) by (consumergroup, topic)"
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              refId: C
              expression: A
              conditions:
                - evaluator: { type: gt, params: [1000] }
                  operator: { type: and }
                  query: { params: [A] }
                  reducer: { type: last }
