global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Application services
  - job_name: api-gateway
    static_configs:
      - targets: ['api-gateway-winx:3000']

  - job_name: auth
    static_configs:
      - targets: ['auth-winx:3001']

  - job_name: notification
    static_configs:
      - targets: ['notification-winx:3002']

  - job_name: profile
    static_configs:
      - targets: ['profile-winx:3003']

  - job_name: match
    static_configs:
      - targets: ['match-winx:3004']

  - job_name: recommendation
    static_configs:
      - targets: ['recommendation-winx:3005']

  - job_name: chat
    static_configs:
      - targets: ['chat-winx:3006']

  # Infrastructure exporters
  - job_name: postgres
    static_configs:
      - targets: ['postgres-exporter:9187']

  - job_name: redis
    static_configs:
      - targets: ['redis-exporter:9121']

  - job_name: mongodb
    static_configs:
      - targets: ['mongodb-exporter:9216']

  - job_name: kafka
    static_configs:
      - targets: ['kafka-exporter:9308']
